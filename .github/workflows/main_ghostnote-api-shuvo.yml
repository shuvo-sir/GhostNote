name: Build and deploy Node.js app to Azure Web App - ghostnote-api-shuvo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        # 👇 NEW: Tell GitHub to open the backend folder first
        working-directory: ./backend 
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # 👇 NEW: Tell GitHub to only upload the backend folder to Azure
          path: ./backend 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AAA0CB9444BB4BDCB9BCF40CA8697F1D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_48142ACB7EB7410599522033D01A88BD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AFE493092A074A96AD33A6D9C56FFC7D }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ghostnote-api-shuvo'
          slot-name: 'Production'
          package: .
